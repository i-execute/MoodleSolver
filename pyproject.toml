[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moodlesolver"
version = "2.4.9"
description = "Moodle quiz automation library and MCP server with local OCR (tesseract + pix2tex) and AI modes (opencode / OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "i-execute" }]
dependencies = ["aiohttp", "mcp"]

[project.optional-dependencies]
ocr = ["pix2tex", "pillow", "pytesseract"]
vision = []

[project.scripts]
moodlesolver = "moodlesolver.mcp_server:main"

[tool.setuptools.packages.find]
include = ["moodlesolver*"]

[tool.setuptools.package-data]
moodlesolver = ["schema/*.json"]
